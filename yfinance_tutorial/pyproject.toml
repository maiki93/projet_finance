[project]
name = "yfinance-tutorial"
version = "0.1.0"
description = "Tutorial for yfinance API usage"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "pympler>=1.1",
    "pytest-benchmark>=5.2.3",
    "rich[jupyter]>=15.0.0",
]
